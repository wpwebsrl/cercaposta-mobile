name: mobile

# CI dell'app Flutter (repo pubblico → minuti Actions GRATUITI e illimitati sui
# runner GitHub-hosted, macOS compreso). Su push/PR girano la CI Android su
# Linux (analyze + test) E la verifica di compilazione iOS (unsigned) su macOS.
# I release (firmati) partono SOLO a mano — vedi workflow_dispatch.
on:
  push:
    branches: [main]
  pull_request:
  # Rilascio manuale (Actions -> mobile -> Run workflow): scegli la piattaforma.
  #   android = solo AAB firmato (artefatto da scaricare, nessuna pubblicazione)
  #   ios     = firma + upload su TestFlight
  #   both    = entrambi
  workflow_dispatch:
    inputs:
      platform:
        description: 'Piattaforma da rilasciare'
        type: choice
        options: [android, ios, both]
        default: android

env:
  FLUTTER_VERSION: '3.32.3'

jobs:
  analyze-test-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tool/check_workflow_pins.py
      - name: Verifica deployment target iOS
        run: python3 tool/check_ios_deployment_target.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.20+101'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run tool/generate_localizations.dart
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: python3 tool/check_version_floor.py
      - run: python3 -m pip install -r tool/requirements-ci.txt
      - run: python3 -m unittest discover -s tool -p test_release_gates.py -v
      - run: python3 -m unittest discover -s tool -p test_version_floor.py -v
      - run: flutter test
      # Inject the build identity (short SHA + commit date), mirroring the web's
      # Vite __APP_BUILD__/__APP_BUILD_DATE__ — surfaced on the About page.
      - run: >
          flutter build apk --debug
          --dart-define=APP_BUILD=$(git rev-parse --short HEAD)
          --dart-define=APP_BUILD_DATE=$(git log -1 --format=%cs)

      - name: Regressioni delle firme Android (chiavi sintetiche)
        run: python3 -m unittest discover -s tool -p test_android_bundle_signing.py -v
      - name: Verifica del gate Gradle release
        run: python3 tool/check_android_signing_gate.py

  # Verifica di compilazione iOS (senza firma) ad ogni push/PR: nel repo
  # pubblico i runner macOS sono gratuiti, quindi la si può tenere sempre
  # accesa (nel monorepo privato era spenta: costava 10× i minuti).
  build-ios-check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tool/check_workflow_pins.py
      - name: Verifica deployment target iOS
        run: python3 tool/check_ios_deployment_target.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: >
          flutter build ios --release --no-codesign
          --dart-define=APP_BUILD=$(git rev-parse --short HEAD)
          --dart-define=APP_BUILD_DATE=$(git log -1 --format=%cs)

  backend-compatibility:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require approved server revision and read credential
        env:
          BACKEND_REF: ${{ vars.BACKEND_COMPAT_REF }}
          BACKEND_TOKEN: ${{ secrets.BACKEND_COMPAT_READ_TOKEN }}
        run: |
          [[ "$BACKEND_REF" =~ ^[a-f0-9]{40}$ ]] && [[ -n "$BACKEND_TOKEN" ]] || {
            echo '::error::Configure BACKEND_COMPAT_REF (full SHA) and a read-only BACKEND_COMPAT_READ_TOKEN.'
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wpwebsrl/cercaposta
          ref: ${{ vars.BACKEND_COMPAT_REF }}
          token: ${{ secrets.BACKEND_COMPAT_READ_TOKEN }}
          path: _backend-compat
          persist-credentials: false
          sparse-checkout: backend/app/core/compat.py
          sparse-checkout-cone-mode: false
      - name: Verify both floors against the exact server revision
        env:
          BACKEND_REF: ${{ vars.BACKEND_COMPAT_REF }}
        run: python3 tool/check_version_floor.py --require-source --expected-commit "$BACKEND_REF" --source _backend-compat/backend/app/core/compat.py

  # Firma la build e la carica su TestFlight. Solo su lancio manuale con
  # platform ios/both: richiede i secret Apple, quindi non gira su push/PR
  # (e le PR da fork non ricevono comunque i secrets — default GitHub).
  release-ios:
    needs: [analyze-test-android, build-ios-check, backend-compatibility]
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'ios' || inputs.platform == 'both')
    # macos-26 (Xcode 26 di default): Apple RIFIUTA gli upload TestFlight/App Store
    # costruiti con SDK precedenti all'iOS 26 (errore 409 "SDK version issue").
    # `macos-latest` usa ancora Xcode 16.4 (SDK iOS 18.5) → non idoneo all'upload.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tool/check_workflow_pins.py
      - name: Verifica deployment target iOS
        run: python3 tool/check_ios_deployment_target.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # v1
        with:
          ruby-version: '3.3.12'
          bundler-cache: true
          working-directory: ios
      - run: flutter pub get --enforce-lockfile
      # Numero di build monotòno crescente (richiesto da TestFlight): run number
      # della CI +100. L'offset garantisce la continuità col monorepo privato,
      # la cui CI era arrivata ~build 20: qui il contatore riparte da 1, e un
      # numero <= a uno già caricato verrebbe rifiutato da Apple/Google.
      # (Le espressioni Actions non fanno aritmetica: si calcola in shell.)
      - name: Build number
        id: bn
        run: echo "num=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_OUTPUT"
      # Scrive FLUTTER_BUILD_NUMBER in Generated.xcconfig, che l'archivio Xcode
      # successivo riusa.
      - run: >
          flutter build ios --release --no-codesign
          --build-number=${{ steps.bn.outputs.num }}
          --dart-define=APP_BUILD=$(git rev-parse --short HEAD)
          --dart-define=APP_BUILD_DATE=$(git log -1 --format=%cs)
      # Rende la ASC API key rintracciabile da xcodebuild per la firma
      # automatica (-allowProvisioningUpdates): il percorso ~/.appstoreconnect/
      # private_keys/AuthKey_<KEY_ID>.p8 è cercato automaticamente da Xcode.
      - name: Installa la ASC API key per xcodebuild
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | openssl base64 -d -A > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: Fastlane beta (firma + upload TestFlight)
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          # Firma via fastlane match (certificato/profilo riusati dallo storage git privato):
          # niente piu' creazione di certificati a ogni run. Bootstrap: workflow ios-signing-bootstrap.
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane beta

  # Build dell'App Bundle Android firmato (release), offuscato. Solo su lancio
  # manuale: richiede i secret di firma, quindi non gira su push/PR.
  # Secret richiesti (GitHub → Settings → Secrets):
  #   ANDROID_KEYSTORE_BASE64  — la upload keystore .jks in base64
  #     (PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("upload-keystore.jks")))
  #   ANDROID_KEY_PROPERTIES   — il contenuto di key.properties, es.:
  #     storeFile=upload-keystore.jks
  #     storePassword=…
  #     keyAlias=upload
  #     keyPassword=…
  release-android:
    needs: [analyze-test-android, backend-compatibility]
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'android' || inputs.platform == 'both')
    runs-on: ubuntu-latest
    env:
      ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.20+101'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Scrivi la configurazione di firma dai secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf '%s' "$ANDROID_KEY_PROPERTIES" > android/key.properties
      # versionCode = run number +100 (v. release-ios: continuità col monorepo);
      # Google Play rifiuta un upload con versionCode <= a uno già caricato.
      # --obfuscate + --split-debug-info: offuscamento del codice Dart in release
      # (hardening §10 del brief); i simboli servono a de-offuscare i crash.
      - name: Build number
        id: bn
        run: echo "num=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_OUTPUT"
      - run: >
          flutter build appbundle --release
          --build-number=${{ steps.bn.outputs.num }}
          --obfuscate --split-debug-info=build/symbols
          --dart-define=APP_BUILD=$(git rev-parse --short HEAD)
          --dart-define=APP_BUILD_DATE=$(git log -1 --format=%cs)
      - name: Verifica firma e certificato del bundle prima della promozione
        run: python3 tool/verify_android_artifact.py build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
      # Simboli di offuscamento: conservali per de-offuscare gli stack trace dei
      # crash di QUESTA build (nome = versionCode caricato, quindi identificabile).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-symbols-${{ steps.bn.outputs.num }}
          path: build/symbols
          if-no-files-found: warn
          retention-days: 90
