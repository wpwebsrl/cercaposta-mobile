name: ios-signing-bootstrap

# BOOTSTRAP / AGGIORNAMENTO CAPABILITY — abilita Associated Domains e Sign in with Apple sul Bundle
# ID Apple, crea o riusa il certificato di distribuzione App Store e rigenera il provisioning
# profile; salva tutto (cifrato) nello storage match, così il job release-ios lo riusa SEMPRE senza creare
# nuovi certificati (era il churn a riempire la quota Apple → «maximum number of certificates»,
# che faceva fallire la firma con «No profiles for 'it.cercaposta.app' were found»).
#
# PRIMA di lanciarlo:
#  1) libera uno slot certificato: developer.apple.com → Certificates → revoca i vecchi
#     certificati «Apple Distribution» inutilizzati (match ne creera' UNO canonico);
#  2) prepara lo storage: un repo git PRIVATO vuoto (GitHub privato o il vostro OneDev);
#  3) imposta i secret del repo (Settings → Secrets → Actions): MATCH_PASSWORD (passphrase a
#     scelta), MATCH_GIT_URL (URL del repo di storage), MATCH_GIT_BASIC_AUTHORIZATION
#     (base64 di "utente:token" con accesso allo storage). Gli ASC_* / APPLE_TEAM_ID esistono gia'.
#
# Poi: Actions → ios-signing-bootstrap → Run workflow. Da eseguire al primo bootstrap e dopo
# l'aggiunta di capability Apple (Associated Domains per le passkey e Sign in with Apple). La lane e'
# idempotente e forza il rinnovo del solo profilo, riusando il certificato esistente.
on:
  workflow_dispatch:

jobs:
  bootstrap:
    # macos-26 (Xcode 26): Apple rifiuta materiale di firma piu' vecchio dell'SDK iOS 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # v1
        with:
          ruby-version: '3.3.12'
          bundler-cache: true
          working-directory: ios
      - name: Installa la ASC API key per fastlane
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | openssl base64 -d -A > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: fastlane certificates (capability Apple + profilo Match aggiornato)
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane certificates
