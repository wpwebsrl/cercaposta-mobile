org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
# Keep upstream build deprecations visible to the diagnostic gate.
org.gradle.warning.mode=all
# Pub sources and build outputs can be on different Windows drives. Kotlin's
# incremental cache cannot relocate these paths. Gradle task/build caches still work.
kotlin.incremental=false
# Use the selected Gradle JDK instead of an additional persistent Kotlin daemon.
kotlin.compiler.execution.strategy=in-process
